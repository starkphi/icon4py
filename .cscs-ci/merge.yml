include:
  - local: '.cscs-ci/base.yml'

variables:
  # See default.yml and generate_ci_pipeline.py for details on how these are
  # used. This pipeline gates merges and variables should not be overridden.
  SESSIONS: "all"
  MODEL_SUBPACKAGES: "all"
  MODEL_SUBSETS: "all"
  MODEL_MPI_SUBPACKAGES: "all"
  MODEL_MPI_SUBSETS: "all"
  BACKENDS: "all"
  LEVELS: "unit:integration"
  GRIDS: "simple:icon_regional"
  TOOLS_SUBSETS: "datatest:unittest"
  FLOAT_PRECISIONS: "single:double"

.only_merge_queue:
  rules: &only_merge_queue
    - if: $CI_COMMIT_BRANCH =~ /^gh-readonly-queue/
      when: always
    - when: never

.not_merge_queue:
  rules: &not_merge_queue
    - if: $CI_COMMIT_BRANCH =~ /^gh-readonly-queue/
      when: never
    - when: always

merge_check:
  extends: [.container-runner-lightweight-zen2]
  rules: *not_merge_queue
  image: alpine:latest
  script:
    - echo "Skipping full merge pipeline; only runs in merge queue"

build_baseimage_aarch64:
  extends: [.build_baseimage_aarch64]
  rules: *only_merge_queue

build_venv_aarch64:
  extends: [.build_venv_aarch64]
  rules: *only_merge_queue

build_image_aarch64:
  extends: [.build_image_aarch64]
  rules: *only_merge_queue

generate_test_child_pipeline:
  extends: [.generate_test_child_pipeline]
  rules: *only_merge_queue

trigger_test_child_pipeline:
  extends: [.trigger_test_child_pipeline]
  rules: *only_merge_queue

# Mixed precision is not in FLOAT_PRECISIONS. 12:00:10 is left out: one vn_traj element
# exceeds the atol. --collect-only fails the job if the selection matches no test.
test_model_mixed_precision_aarch64:
  extends: [.test_model_aarch64]
  stage: test
  needs: [build_image_aarch64]
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^gh-readonly-queue/
      variables:
        SLURM_TIMELIMIT: '00:30:00'
    - when: never
  variables:
    FLOAT_PRECISION: "mixed"
    BACKEND: "gtfn_cpu"
    MIXED_SELECTION: "test_run_solve_nonhydro_multi_step and 12:00:20 and not benchmark_only"
  script:
    - nox -s "test_model-${PYVERSION_SHORT}(datatest, dycore)" -- --backend=$BACKEND -k "$MIXED_SELECTION" --collect-only -q
    - nox -s "test_model-${PYVERSION_SHORT}(datatest, dycore)" -- --backend=$BACKEND -k "$MIXED_SELECTION"
